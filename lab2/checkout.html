<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформить заказ — ЛанчТайм</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lunch.css">
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header>
        <h1>Оформить заказ</h1>
        <nav>
            <ul>
                <li><a href="../lab1/index.html">Главная</a></li>
                <li><a href="index.html">Собрать ланч</a></li>
                <li><a href="checkout.html" class="active">Оформить заказ</a></li>
                <li><a href="orders.html">Заказы</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cart-section">
            <h2>Состав заказа</h2>
            <div id="cart-container" class="cart-container">
                <!-- Сюда JS будет выводить карточки -->
            </div>
            <div id="empty-message" class="empty-message" style="display: none;">
                Ничего не выбрано. Чтобы добавить блюда в заказ, перейдите на страницу <a href="index.html">Собрать ланч</a>.
            </div>
        </section>

        <section class="order-form-section">
            <h2>Оформление заказа</h2>
            <form id="checkout-form">
                <div class="form-columns">
                    <div class="order-summary-block">
                        <h3>Ваш заказ</h3>
                        <div id="order-summary-list"></div>
                        <p class="total">Стоимость заказа: <span id="checkout-total">0</span> ₽</p>
                    </div>

                    <div class="client-block">
                        <h3>Данные клиента</h3>
                        <label for="full_name">Имя</label>
                        <input type="text" id="full_name" name="full_name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <div class="checkbox-row">
                            <input type="checkbox" id="subscribe" name="subscribe" checked>
                            <label for="subscribe">Подписаться на рассылку</label>
                        </div>

                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" required>

                        <label for="delivery_address">Адрес</label>
                        <input type="text" id="delivery_address" name="delivery_address" required>

                        <fieldset>
                            <legend>Время доставки</legend>
                            <div class="radio-row">
                                <input type="radio" id="type_now" name="delivery_type" value="now" required>
                                <label for="type_now">Как можно скорее</label>
                            </div>
                            <div class="radio-row">
                                <input type="radio" id="type_by_time" name="delivery_type" value="by_time">
                                <label for="type_by_time">Точное время</label>
                            </div>
                        </fieldset>

                        <label for="delivery_time">Укажите время</label>
                        <input type="time" id="delivery_time" name="delivery_time" min="07:00" max="23:00" step="300">

                        <label for="comment">Комментарий</label>
                        <textarea id="comment" name="comment" rows="3"></textarea>

                        <div class="buttons-row">
                            <button type="submit" id="submit-btn">Отправить заказ</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Телефон: <a href="tel:+74951234567">+7 (495) 123-45-67</a></p>
    </footer>

    <script type="module" src="checkout.js"></script>
</body>
</html>
